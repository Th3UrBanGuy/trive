<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="encG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c3f81"/>
      <stop offset="100%" stop-color="#1a8aae"/>
    </linearGradient>
    <marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b7a"/>
    </marker>
    <filter id="shE" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="960" height="640" fill="#f4f7fa"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#203240">TriVE — Encryption & Erasure Coding Mechanism</text>

  <!-- Key derivation -->
  <rect x="40" y="60" width="880" height="110" rx="10" fill="white" stroke="#dbe4ec" filter="url(#shE)"/>
  <text x="60" y="82" font-size="12" font-weight="700" fill="#1c3f81" letter-spacing="1">KEY DERIVATION (per user)</text>

  <rect x="60" y="96" width="180" height="56" rx="8" fill="#fde8e8" stroke="#f0b8b8"/>
  <text x="150" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#c44">APP_SECRET (env)</text>
  <text x="150" y="134" text-anchor="middle" font-size="9" fill="#c44">⚠ fallback = "telecloud-dev-fallback"</text>
  <text x="150" y="146" text-anchor="middle" font-size="8" fill="#c44">(VULN C-2: refuse to boot without)</text>

  <line x1="240" y1="124" x2="275" y2="124" stroke="#5a6b7a" stroke-width="2" marker-end="url(#arrE)"/>

  <rect x="280" y="96" width="140" height="56" rx="8" fill="#e8f0f7" stroke="#cce0ed"/>
  <text x="350" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#1c3f81">encSalt</text>
  <text x="350" y="134" text-anchor="middle" font-size="9" fill="#5a6b7a">16 random bytes</text>
  <text x="350" y="146" text-anchor="middle" font-size="9" fill="#5a6b7a">(per user, hex)</text>

  <line x1="420" y1="124" x2="455" y2="124" stroke="#5a6b7a" stroke-width="2" marker-end="url(#arrE)"/>

  <rect x="460" y="96" width="180" height="56" rx="8" fill="url(#encG)"/>
  <text x="550" y="116" text-anchor="middle" font-size="10" font-weight="600" fill="white">scryptSync(secret, salt, 32)</text>
  <text x="550" y="132" text-anchor="middle" font-size="9" fill="white" opacity="0.9">Node defaults: N=16384, r=8, p=1</text>
  <text x="550" y="144" text-anchor="middle" font-size="8" fill="white" opacity="0.8">⚠ OWASP recommends N=2^17 (L-3)</text>

  <line x1="640" y1="124" x2="675" y2="124" stroke="#5a6b7a" stroke-width="2" marker-end="url(#arrE)"/>

  <rect x="680" y="96" width="220" height="56" rx="8" fill="#1c3f81"/>
  <text x="790" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="white">32-byte AES-256 key</text>
  <text x="790" y="134" text-anchor="middle" font-size="9" fill="white" opacity="0.9">⚠ Same for ALL this user's chunks</text>
  <text x="790" y="146" text-anchor="middle" font-size="8" fill="white" opacity="0.8">⚠ Server-side (NOT zero-knowledge — C-3)</text>

  <!-- Per-chunk encrypt -->
  <rect x="40" y="190" width="880" height="170" rx="10" fill="white" stroke="#dbe4ec" filter="url(#shE)"/>
  <text x="60" y="212" font-size="12" font-weight="700" fill="#1c3f81" letter-spacing="1">PER-CHUNK ENCRYPT (AES-256-GCM)</text>

  <rect x="60" y="226" width="120" height="50" rx="8" fill="#e8f5e8" stroke="#b8d8b8"/>
  <text x="120" y="246" text-anchor="middle" font-size="10" font-weight="600" fill="#2a6a2a">Plaintext chunk</text>
  <text x="120" y="262" text-anchor="middle" font-size="9" fill="#5a6b7a">20MB slice</text>

  <line x1="180" y1="251" x2="215" y2="251" stroke="#5a6b7a" stroke-width="2" marker-end="url(#arrE)"/>

  <rect x="220" y="226" width="100" height="50" rx="8" fill="#e8f0f7" stroke="#cce0ed"/>
  <text x="270" y="246" text-anchor="middle" font-size="10" font-weight="600" fill="#1c3f81">IV (12 bytes)</text>
  <text x="270" y="262" text-anchor="middle" font-size="9" fill="#5a6b7a">random per chunk</text>

  <line x1="320" y1="251" x2="355" y2="251" stroke="#5a6b7a" stroke-width="2" marker-end="url(#arrE)"/>

  <rect x="360" y="226" width="160" height="50" rx="8" fill="url(#encG)"/>
  <text x="440" y="246" text-anchor="middle" font-size="10" font-weight="600" fill="white">AES-256-GCM cipher</text>
  <text x="440" y="262" text-anchor="middle" font-size="9" fill="white" opacity="0.9">update(buf) + final()</text>

  <line x1="520" y1="251" x2="555" y2="251" stroke="#5a6b7a" stroke-width="2" marker-end="url(#arrE)"/>

  <rect x="560" y="226" width="140" height="50" rx="8" fill="#1c3f81"/>
  <text x="630" y="246" text-anchor="middle" font-size="10" font-weight="600" fill="white">Ciphertext</text>
  <text x="630" y="262" text-anchor="middle" font-size="9" fill="white" opacity="0.9">(same length as plain)</text>

  <line x1="700" y1="251" x2="735" y2="251" stroke="#5a6b7a" stroke-width="2" marker-end="url(#arrE)"/>

  <rect x="740" y="226" width="140" height="50" rx="8" fill="#1a8aae"/>
  <text x="810" y="246" text-anchor="middle" font-size="10" font-weight="600" fill="white">Auth Tag (16 bytes)</text>
  <text x="810" y="262" text-anchor="middle" font-size="9" fill="white" opacity="0.9">getAuthTag()</text>

  <!-- Combined output -->
  <rect x="220" y="296" width="660" height="50" rx="8" fill="#2a3a4c"/>
  <text x="550" y="316" text-anchor="middle" font-size="10" font-weight="600" fill="white">Stored = concat(ciphertext, tag)</text>
  <text x="550" y="332" text-anchor="middle" font-size="9" fill="white" opacity="0.8">Total size = plainSize + 16 bytes</text>

  <!-- Decrypt rule -->
  <rect x="60" y="296" width="140" height="50" rx="8" fill="#fde8e8" stroke="#f0b8b8"/>
  <text x="130" y="312" text-anchor="middle" font-size="9" font-weight="600" fill="#c44">CRITICAL RULE</text>
  <text x="130" y="326" text-anchor="middle" font-size="8" fill="#c44">Tag = LAST 16 bytes</text>
  <text x="130" y="338" text-anchor="middle" font-size="8" fill="#c44">→ must truncate first</text>

  <!-- Erasure coding -->
  <rect x="40" y="380" width="880" height="240" rx="10" fill="white" stroke="#dbe4ec" filter="url(#shE)"/>
  <text x="60" y="402" font-size="12" font-weight="700" fill="#8a5a1a" letter-spacing="1">ERASURE CODING — Reed-Solomon GF(2⁸) (files ≥ 60MB / 3+ chunks)</text>

  <!-- Encode -->
  <text x="60" y="424" font-size="10" font-weight="600" fill="#1c3f81">ENCODE (upload path):</text>
  <rect x="60" y="432" width="120" height="40" rx="6" fill="#e8f0f7" stroke="#cce0ed"/>
  <text x="120" y="456" text-anchor="middle" font-size="9" fill="#1c3f81">N data shards</text>
  <text x="120" y="468" text-anchor="middle" font-size="8" fill="#5a6b7a">(encrypted, padded)</text>

  <line x1="180" y1="452" x2="210" y2="452" stroke="#5a6b7a" stroke-width="2" marker-end="url(#arrE)"/>

  <rect x="215" y="432" width="220" height="40" rx="6" fill="url(#encG)"/>
  <text x="325" y="450" text-anchor="middle" font-size="9" font-weight="600" fill="white">Vandermonde(N+M, N) × topInverse</text>
  <text x="325" y="464" text-anchor="middle" font-size="8" fill="white" opacity="0.9">= generator matrix (top N = identity)</text>

  <line x1="435" y1="452" x2="465" y2="452" stroke="#5a6b7a" stroke-width="2" marker-end="url(#arrE)"/>

  <rect x="470" y="432" width="120" height="40" rx="6" fill="#fef3e8" stroke="#f0d8b8"/>
  <text x="530" y="456" text-anchor="middle" font-size="9" fill="#8a5a1a">M parity shards</text>
  <text x="530" y="468" text-anchor="middle" font-size="8" fill="#5a6b7a">(GF multiply)</text>

  <line x1="590" y1="452" x2="620" y2="452" stroke="#5a6b7a" stroke-width="2" marker-end="url(#arrE)"/>

  <rect x="625" y="432" width="270" height="40" rx="6" fill="#2a8a4a"/>
  <text x="760" y="450" text-anchor="middle" font-size="9" font-weight="600" fill="white">Upload N+M shards to Telegram</text>
  <text x="760" y="464" text-anchor="middle" font-size="8" fill="white" opacity="0.9">each shard = separate message</text>

  <!-- Decode -->
  <text x="60" y="498" font-size="10" font-weight="600" fill="#1c3f81">DECODE (download path, if shard missing):</text>
  <rect x="60" y="506" width="160" height="40" rx="6" fill="#fde8e8" stroke="#f0b8b8"/>
  <text x="140" y="524" text-anchor="middle" font-size="9" fill="#c44">Available shards</text>
  <text x="140" y="538" text-anchor="middle" font-size="8" fill="#5a6b7a">(some missing, some parity)</text>

  <line x1="220" y1="526" x2="250" y2="526" stroke="#5a6b7a" stroke-width="2" marker-end="url(#arrE)"/>

  <rect x="255" y="506" width="240" height="40" rx="6" fill="#1c3f81"/>
  <text x="375" y="524" text-anchor="middle" font-size="9" font-weight="600" fill="white">Build submatrix from GENERATOR</text>
  <text x="375" y="538" text-anchor="middle" font-size="8" fill="white" opacity="0.9">⚠ NOT raw Vandermonde (was Task 5 bug)</text>

  <line x1="495" y1="526" x2="525" y2="526" stroke="#5a6b7a" stroke-width="2" marker-end="url(#arrE)"/>

  <rect x="530" y="506" width="140" height="40" rx="6" fill="url(#encG)"/>
  <text x="600" y="524" text-anchor="middle" font-size="9" font-weight="600" fill="white">matrixInverse(sub)</text>
  <text x="600" y="538" text-anchor="middle" font-size="8" fill="white" opacity="0.9">over GF(2⁸)</text>

  <line x1="670" y1="526" x2="700" y2="526" stroke="#5a6b7a" stroke-width="2" marker-end="url(#arrE)"/>

  <rect x="705" y="506" width="190" height="40" rx="6" fill="#2a8a4a"/>
  <text x="800" y="524" text-anchor="middle" font-size="9" font-weight="600" fill="white">Reconstruct missing data</text>
  <text x="800" y="538" text-anchor="middle" font-size="8" fill="white" opacity="0.9">GF multiply decodeMatrix × shards</text>

  <!-- GF arithmetic -->
  <rect x="60" y="560" width="840" height="48" rx="8" fill="#f0f5f9" stroke="#dbe4ec"/>
  <text x="80" y="580" font-size="10" font-weight="600" fill="#1c3f81">GF(2⁸) arithmetic:</text>
  <text x="80" y="596" font-size="9" fill="#5a6b7a">primitive poly 0x11d · exp/log tables · gfMul(a,b) = exp[log[a]+log[b]] · gfDiv = exp[(log[a]-log[b]+255)%255] · gfInv = exp[255-log[a]]</text>
  <text x="500" y="580" font-size="9" font-weight="600" fill="#1c3f81">Parity overhead:</text>
  <text x="500" y="596" font-size="9" fill="#5a6b7a">M = max(2, ceil(N×0.5)) → ~50% overhead → any N of N+M shards reconstructs</text>
</svg>

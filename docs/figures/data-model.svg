<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sh4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="960" height="520" fill="#f4f7fa"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#203240">TriVE — Data Model (ER Diagram)</text>

  <!-- User -->
  <rect x="50" y="60" width="240" height="200" rx="10" fill="white" stroke="#dbe4ec" filter="url(#sh4)"/>
  <rect x="50" y="60" width="240" height="28" rx="10" fill="#1c3f81"/>
  <text x="170" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="white">User</text>
  <text x="60" y="104" font-size="9" font-family="monospace" fill="#5a6b7a">id          String  @id</text>
  <text x="60" y="118" font-size="9" font-family="monospace" fill="#1c3f81" font-weight="600">phone       String  @unique</text>
  <text x="60" y="132" font-size="9" font-family="monospace" fill="#5a6b7a">telegramUsername  String?</text>
  <text x="60" y="146" font-size="9" font-family="monospace" fill="#5a6b7a">telegramSession   String? (enc)</text>
  <text x="60" y="160" font-size="9" font-family="monospace" fill="#5a6b7a">vaultChannelId    String?</text>
  <text x="60" y="174" font-size="9" font-family="monospace" fill="#5a6b7a">vaultChannelAccess String?</text>
  <text x="60" y="188" font-size="9" font-family="monospace" fill="#5a6b7a">encSalt           String?</text>
  <text x="60" y="202" font-size="9" font-family="monospace" fill="#8a5a1a">encVerifier       String? (unused!)</text>
  <text x="60" y="216" font-size="9" font-family="monospace" fill="#5a6b7a">storageLimitBytes BigInt  @default(0)</text>
  <text x="60" y="230" font-size="9" font-family="monospace" fill="#5a6b7a">createdAt / updatedAt</text>
  <text x="60" y="248" font-size="8" fill="#c44">⚠ telegramUsername NOT @unique</text>

  <!-- Folder -->
  <rect x="360" y="60" width="240" height="180" rx="10" fill="white" stroke="#dbe4ec" filter="url(#sh4)"/>
  <rect x="360" y="60" width="240" height="28" rx="10" fill="#1e84c6"/>
  <text x="480" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="white">Folder</text>
  <text x="370" y="104" font-size="9" font-family="monospace" fill="#5a6b7a">id          String  @id</text>
  <text x="370" y="118" font-size="9" font-family="monospace" fill="#1c3f81" font-weight="600">userId      String  (FK)</text>
  <text x="370" y="132" font-size="9" font-family="monospace" fill="#5a6b7a">name        String</text>
  <text x="370" y="146" font-size="9" font-family="monospace" fill="#5a6b7a">parentId    String? (self-ref)</text>
  <text x="370" y="160" font-size="9" font-family="monospace" fill="#5a6b7a">color       String?</text>
  <text x="370" y="174" font-size="9" font-family="monospace" fill="#5a6b7a">icon        String?</text>
  <text x="370" y="188" font-size="9" font-family="monospace" fill="#5a6b7a">starred     Boolean @default(false)</text>
  <text x="370" y="202" font-size="9" font-family="monospace" fill="#5a6b7a">trashed     Boolean @default(false)</text>
  <text x="370" y="216" font-size="9" font-family="monospace" fill="#5a6b7a">createdAt / updatedAt</text>
  <text x="370" y="232" font-size="8" fill="#c44">⚠ parentId cycle not prevented (L-7)</text>

  <!-- File -->
  <rect x="670" y="60" width="240" height="200" rx="10" fill="white" stroke="#dbe4ec" filter="url(#sh4)"/>
  <rect x="670" y="60" width="240" height="28" rx="10" fill="#1a8aae"/>
  <text x="790" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="white">File</text>
  <text x="680" y="104" font-size="9" font-family="monospace" fill="#5a6b7a">id              String  @id</text>
  <text x="680" y="118" font-size="9" font-family="monospace" fill="#1c3f81" font-weight="600">userId          String  (FK)</text>
  <text x="680" y="132" font-size="9" font-family="monospace" fill="#1c3f81" font-weight="600">folderId        String? (FK)</text>
  <text x="680" y="146" font-size="9" font-family="monospace" fill="#5a6b7a">name, mimeType, size</text>
  <text x="680" y="160" font-size="9" font-family="monospace" fill="#5a6b7a">encIv           String?</text>
  <text x="680" y="174" font-size="9" font-family="monospace" fill="#5a6b7a">checksum        String? (sha256 plain)</text>
  <text x="680" y="188" font-size="9" font-family="monospace" fill="#5a6b7a">manifestMessageId String?</text>
  <text x="680" y="202" font-size="9" font-family="monospace" fill="#5a6b7a">dataShards, parityShards  Int</text>
  <text x="680" y="216" font-size="9" font-family="monospace" fill="#5a6b7a">dedupedChunks   Int</text>
  <text x="680" y="230" font-size="9" font-family="monospace" fill="#5a6b7a">starred, trashed, thumbnail</text>
  <text x="680" y="248" font-size="8" fill="#5a6b7a">onDelete: Cascade from User, SetNull from Folder</text>

  <!-- FileChunk -->
  <rect x="670" y="290" width="240" height="180" rx="10" fill="white" stroke="#dbe4ec" filter="url(#sh4)"/>
  <rect x="670" y="290" width="240" height="28" rx="10" fill="#1a8aae"/>
  <text x="790" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="white">FileChunk</text>
  <text x="680" y="334" font-size="9" font-family="monospace" fill="#5a6b7a">id              String  @id</text>
  <text x="680" y="348" font-size="9" font-family="monospace" fill="#1c3f81" font-weight="600">fileId          String  (FK)</text>
  <text x="680" y="362" font-size="9" font-family="monospace" fill="#5a6b7a">index           Int (0-based)</text>
  <text x="680" y="376" font-size="9" font-family="monospace" fill="#1c3f81" font-weight="600">telegramMessageId  String</text>
  <text x="680" y="390" font-size="9" font-family="monospace" fill="#5a6b7a">encIv           String (per-chunk)</text>
  <text x="680" y="404" font-size="9" font-family="monospace" fill="#5a6b7a">plainSize       BigInt</text>
  <text x="680" y="418" font-size="9" font-family="monospace" fill="#5a6b7a">checksum        String? (sha256 enc)</text>
  <text x="680" y="432" font-size="9" font-family="monospace" fill="#5a6b7a">isParity, deduped  Boolean</text>
  <text x="680" y="446" font-size="9" font-family="monospace" fill="#5a6b7a">shardSize       BigInt</text>
  <text x="680" y="460" font-size="8" fill="#5a6b7a">@@index[fileId, index] @@index[checksum]</text>

  <!-- ShareLink -->
  <rect x="360" y="290" width="240" height="200" rx="10" fill="white" stroke="#dbe4ec" filter="url(#sh4)"/>
  <rect x="360" y="290" width="240" height="28" rx="10" fill="#1c3f81"/>
  <text x="480" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="white">ShareLink</text>
  <text x="370" y="334" font-size="9" font-family="monospace" fill="#5a6b7a">id              String  @id</text>
  <text x="370" y="348" font-size="9" font-family="monospace" fill="#1c3f81" font-weight="600">userId          String  (FK)</text>
  <text x="370" y="362" font-size="9" font-family="monospace" fill="#5a6b7a">fileId          String? (1:1)</text>
  <text x="370" y="376" font-size="9" font-family="monospace" fill="#5a6b7a">folderId        String? (1:1)</text>
  <text x="370" y="390" font-size="9" font-family="monospace" fill="#1c3f81" font-weight="600">token           String  @unique</text>
  <text x="370" y="404" font-size="9" font-family="monospace" fill="#1c3f81" font-weight="600">customSlug      String? @unique</text>
  <text x="370" y="418" font-size="9" font-family="monospace" fill="#5a6b7a">password, expiresAt</text>
  <text x="370" y="432" font-size="9" font-family="monospace" fill="#5a6b7a">viewCount, maxViews</text>
  <text x="370" y="446" font-size="9" font-family="monospace" fill="#5a6b7a">downloadCount, maxDownloads</text>
  <text x="370" y="460" font-size="9" font-family="monospace" fill="#5a6b7a">viewOnly, emailGate, allowedEmails</text>
  <text x="370" y="474" font-size="9" font-family="monospace" fill="#5a6b7a">accessIps, lastAccessedAt</text>

  <!-- ShareItem -->
  <rect x="50" y="290" width="240" height="120" rx="10" fill="white" stroke="#dbe4ec" filter="url(#sh4)"/>
  <rect x="50" y="290" width="240" height="28" rx="10" fill="#1c3f81"/>
  <text x="170" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="white">ShareItem</text>
  <text x="60" y="334" font-size="9" font-family="monospace" fill="#5a6b7a">id              String  @id</text>
  <text x="60" y="348" font-size="9" font-family="monospace" fill="#1c3f81" font-weight="600">shareLinkId     String  (FK)</text>
  <text x="60" y="362" font-size="9" font-family="monospace" fill="#5a6b7a">fileId          String? (no FK!)</text>
  <text x="60" y="376" font-size="9" font-family="monospace" fill="#5a6b7a">folderId        String? (no FK!)</text>
  <text x="60" y="396" font-size="8" fill="#c44">⚠ Plain strings, no FK → orphaned (O-4)</text>

  <!-- Activity -->
  <rect x="50" y="430" width="240" height="80" rx="10" fill="white" stroke="#dbe4ec" filter="url(#sh4)"/>
  <rect x="50" y="430" width="240" height="28" rx="10" fill="#5a6b7a"/>
  <text x="170" y="448" text-anchor="middle" font-size="13" font-weight="700" fill="white">Activity</text>
  <text x="60" y="474" font-size="9" font-family="monospace" fill="#5a6b7a">id, userId (FK), action, details</text>
  <text x="60" y="488" font-size="9" font-family="monospace" fill="#5a6b7a">createdAt</text>
  <text x="60" y="502" font-size="8" fill="#c44">⚠ PII (phone), no retention (M-5)</text>

  <!-- Relations -->
  <line x1="290" y1="160" x2="360" y2="160" stroke="#1c3f81" stroke-width="2"/>
  <text x="325" y="154" text-anchor="middle" font-size="8" fill="#5a6b7a">1:N</text>
  <line x1="600" y1="160" x2="670" y2="160" stroke="#1c3f81" stroke-width="2"/>
  <text x="635" y="154" text-anchor="middle" font-size="8" fill="#5a6b7a">1:N</text>
  <line x1="790" y1="260" x2="790" y2="290" stroke="#1a8aae" stroke-width="2"/>
  <text x="800" y="278" font-size="8" fill="#5a6b7a">1:N</text>
  <line x1="290" y1="390" x2="360" y2="390" stroke="#1c3f81" stroke-width="2"/>
  <text x="325" y="384" text-anchor="middle" font-size="8" fill="#5a6b7a">1:N</text>
  <line x1="600" y1="390" x2="670" y2="390" stroke="#1c3f81" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="635" y="384" text-anchor="middle" font-size="8" fill="#5a6b7a">1:1?</text>
  <line x1="290" y1="470" x2="360" y2="430" stroke="#1c3f81" stroke-width="2" stroke-dasharray="4 2"/>
</svg>
